<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Favicon Drop Shadow / Glow -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00ffa8" flood-opacity="0.9"/>
    </filter>

    <radialGradient id="fav-green-orb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#b4ffea"/>
      <stop offset="65%" stop-color="#00ffa8"/>
      <stop offset="100%" stop-color="#00b86c"/>
    </radialGradient>

    <radialGradient id="fav-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071e13"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>

    <linearGradient id="fav-stroke" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="48" y2="48">
      <stop offset="0%" stop-color="#00ffa8"/>
      <stop offset="100%" stop-color="#00e08f"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle Badge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#fav-bg)" stroke="#00ffa8" stroke-width="2.2" filter="url(#fav-glow)"/>

  <!-- Left Vertical Line (BL to TL) -->
  <line x1="18" y1="46" x2="18" y2="17" stroke="#00ffa8" stroke-width="4.8" stroke-linecap="round"/>
  <line x1="18" y1="46" x2="18" y2="17" stroke="url(#fav-stroke)" stroke-width="4.8" stroke-linecap="round"/>

  <!-- Continuous Main 'N' Trace -->
  <path d="M 18 46 L 18 17 L 33 30.5 L 41.5 37.5 Q 46 40.5 46 35.5 L 46 18" fill="none" stroke="url(#fav-stroke)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower Parallel Trace -->
  <path d="M 25.5 34 L 38.5 45.5 Q 42.5 48 47 48" fill="none" stroke="url(#fav-stroke)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4 Glowing Green Nodes -->
  <circle cx="18" cy="17" r="5.2" fill="url(#fav-green-orb)"/>
  <circle cx="18" cy="46" r="5.2" fill="url(#fav-green-orb)"/>
  <circle cx="46" cy="18" r="5.2" fill="url(#fav-green-orb)"/>
  <circle cx="47" cy="48" r="5.2" fill="url(#fav-green-orb)"/>

  <!-- Central White Node -->
  <circle cx="33" cy="30.5" r="4.8" fill="#ffffff"/>
</svg>
