<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020604"/>
      <stop offset="40%" stop-color="#040b07"/>
      <stop offset="100%" stop-color="#02140a"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <radialGradient id="center-glow" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary Accent Glow -->
    <radialGradient id="corner-glow" cx="15%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#040b07" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Logo Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#00ff87" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Grid Pattern Overlay -->
  <g stroke="rgba(16, 185, 129, 0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>

    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Glow Areas -->
  <rect width="1200" height="630" fill="url(#center-glow)"/>
  <rect width="1200" height="630" fill="url(#corner-glow)"/>

  <!-- Decorative Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5"/>

  <!-- Right Side Abstract Neural Visual Display -->
  <g transform="translate(820, 315)">
    <!-- Concentric Orbit Rings -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(0, 255, 135, 0.2)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- Central Node -->
    <circle cx="0" cy="0" r="50" fill="#04120a" stroke="#00ff87" stroke-width="2.5" filter="url(#glow-shadow)"/>
    <circle cx="0" cy="0" r="14" fill="#00ff87"/>

    <!-- Orbiting Satellite Nodes -->
    <line x1="0" y1="0" x2="-100" y2="-100" stroke="rgba(0, 255, 135, 0.4)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="-100" cy="-100" r="14" fill="#082014" stroke="#00ff87" stroke-width="2"/>
    <circle cx="-100" cy="-100" r="5" fill="#ffffff"/>

    <line x1="0" y1="0" x2="110" y2="-85" stroke="rgba(0, 255, 135, 0.4)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="110" cy="-85" r="12" fill="#082014" stroke="#10b981" stroke-width="2"/>
    <circle cx="110" cy="-85" r="4" fill="#00ff87"/>

    <line x1="0" y1="0" x2="-120" y2="90" stroke="rgba(0, 255, 135, 0.4)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="-120" cy="90" r="16" fill="#082014" stroke="#00ff87" stroke-width="2"/>
    <circle cx="-120" cy="90" r="6" fill="#00ff87"/>

    <line x1="0" y1="0" x2="95" y2="105" stroke="rgba(0, 255, 135, 0.4)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="95" cy="105" r="13" fill="#082014" stroke="#10b981" stroke-width="2"/>
    <circle cx="95" cy="105" r="4" fill="#ffffff"/>
  </g>

  <!-- Left Side Typography & Branding (LTR & Arabic Unified) -->
  <g transform="translate(100, 120)">
    <!-- Brand Logo Icon & Wordmark -->
    <g transform="translate(0, 0)">
      <!-- Squircle Badge -->
      <rect width="64" height="64" rx="18" fill="#040b07" stroke="#00ffa8" stroke-width="2"/>
      <!-- Circuit Paths -->
      <line x1="18" y1="46" x2="18" y2="17" stroke="#00ffa8" stroke-width="4.2" stroke-linecap="round"/>
      <!-- Continuous Main 'N' Trace (BL -> TL -> Center -> TR) -->
      <path d="M 18 46 L 18 17 L 33.5 31 L 42 38.5 Q 46 41.5 46 36.5 L 46 18" fill="none" stroke="#00ffa8" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Lower Parallel Trace -->
      <path d="M 25 34 L 38.5 46 Q 42.5 48 47 48" fill="none" stroke="#00ffa8" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Glowing Nodes -->
      <circle cx="18" cy="17" r="4.8" fill="#00ffa8"/>
      <circle cx="18" cy="46" r="4.8" fill="#00ffa8"/>
      <circle cx="46" cy="18" r="4.8" fill="#00ffa8"/>
      <circle cx="47" cy="48" r="4.8" fill="#00ffa8"/>
      <circle cx="33.5" cy="31" r="4.2" fill="#ffffff"/>

      <text x="82" y="46" fill="url(#logo-grad)" font-family="'Cairo', -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="0.5">Noviara</text>
    </g>

    <!-- Tag Badge -->
    <g transform="translate(0, 95)">
      <rect width="330" height="36" rx="18" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(0, 255, 135, 0.3)" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#00ff87"/>
      <text x="36" y="24" fill="#00ff87" font-family="'Cairo', -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="1">AI AUTOMATION &amp; CUSTOM SYSTEMS</text>
    </g>

    <!-- Main Headline in Arabic -->
    <text x="0" y="195" fill="#ffffff" font-family="'Cairo', -apple-system, sans-serif" font-weight="900" font-size="44">
      نحوّل أعمالك إلى منظومة ذكية
    </text>
    <text x="0" y="255" fill="#00ff87" font-family="'Cairo', -apple-system, sans-serif" font-weight="900" font-size="44">
      تعمل بأقصى كفاءة وسرعة
    </text>

    <!-- Subtitle / Value Statement -->
    <text x="0" y="315" fill="#94a3b8" font-family="'Cairo', -apple-system, sans-serif" font-weight="500" font-size="20">
      أتمتة العمليات • أنظمة إدارة مخصصة • وكلاء ذكاء اصطناعي للشركات والعيادات
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="14" y="22" fill="#f8fafc" font-family="'Cairo', sans-serif" font-size="14" font-weight="600">AI + CRM</text>

      <rect x="145" y="0" width="170" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="159" y="22" fill="#f8fafc" font-family="'Cairo', sans-serif" font-size="14" font-weight="600">Clinic Automation</text>

      <rect x="330" y="0" width="160" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="344" y="22" fill="#f8fafc" font-family="'Cairo', sans-serif" font-size="14" font-weight="600">Smart AI Agents</text>
    </g>
  </g>
</svg>
