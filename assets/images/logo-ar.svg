<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" dir="rtl">
  <defs>
    <!-- Google Cairo Font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&amp;display=swap');
      .brand-title-ar {
        font-family: 'Cairo', 'IBM Plex Sans Arabic', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 84px;
        letter-spacing: 0;
      }
    </style>

    <!-- Outer Badge Glow Filter -->
    <filter id="ar-badge-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00ffa8" flood-opacity="0.75"/>
    </filter>

    <!-- Green Node Glow Filter -->
    <filter id="ar-node-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00ffa8" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.6"/>
    </filter>

    <!-- White Center Node Glow Filter -->
    <filter id="ar-white-node-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00ffa8" flood-opacity="0.5"/>
    </filter>

    <!-- Green Glowing Orb Gradient -->
    <radialGradient id="ar-green-orb-grad" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#a8ffdf"/>
      <stop offset="60%" stop-color="#00ffa8"/>
      <stop offset="100%" stop-color="#00cc7a"/>
    </radialGradient>

    <!-- Badge Background Radial -->
    <radialGradient id="ar-badge-bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#061910"/>
      <stop offset="60%" stop-color="#030c07"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>

    <!-- Stroke Gradient -->
    <linearGradient id="ar-stroke-grad" gradientUnits="userSpaceOnUse" x1="50" y1="50" x2="150" y2="150">
      <stop offset="0%" stop-color="#00ffa8"/>
      <stop offset="50%" stop-color="#00f299"/>
      <stop offset="100%" stop-color="#00d680"/>
    </linearGradient>

    <!-- Wordmark Horizontal Gradient -->
    <linearGradient id="ar-wordmark-grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#ebfff8"/>
      <stop offset="58%" stop-color="#69f8be"/>
      <stop offset="85%" stop-color="#00ffa8"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>
  </defs>

  <!-- 1. ICON BADGE (on Right for RTL layout, x: 420..596) -->
  <g transform="translate(420, 0)">
    <!-- Background Squircle Badge -->
    <rect x="12" y="12" width="176" height="176" rx="52" fill="url(#ar-badge-bg-grad)" stroke="#00ffa8" stroke-width="4.5" filter="url(#ar-badge-glow)"/>

    <!-- Left Vertical Line (BL to TL) -->
    <line x1="56" y1="144" x2="56" y2="54" stroke="#00ffa8" stroke-width="13" stroke-linecap="round"/>
    <line x1="56" y1="144" x2="56" y2="54" stroke="url(#ar-stroke-grad)" stroke-width="13" stroke-linecap="round"/>

    <!-- Continuous Main 'N' Trace -->
    <path d="M 56 144 L 56 54 L 104 96 L 131 120 Q 144 130 144 114 L 144 56" fill="none" stroke="url(#ar-stroke-grad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lower Parallel Trace -->
    <path d="M 79 106 L 121 144 Q 133 150 148 150" fill="none" stroke="url(#ar-stroke-grad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 4 Glowing Green Nodes -->
    <circle cx="56" cy="54" r="15" fill="url(#ar-green-orb-grad)" filter="url(#ar-node-glow)"/>
    <circle cx="56" cy="144" r="15" fill="url(#ar-green-orb-grad)" filter="url(#ar-node-glow)"/>
    <circle cx="144" cy="56" r="15" fill="url(#ar-green-orb-grad)" filter="url(#ar-node-glow)"/>
    <circle cx="148" cy="150" r="15" fill="url(#ar-green-orb-grad)" filter="url(#ar-node-glow)"/>

    <!-- Central White Node -->
    <circle cx="104" cy="96" r="13.5" fill="#ffffff" filter="url(#ar-white-node-glow)"/>
  </g>

  <!-- 2. ARABIC WORDMARK "نوفيرا" -->
  <text x="390" y="130" text-anchor="end" class="brand-title-ar" fill="url(#ar-wordmark-grad)">نوفيرا</text>
</svg>
