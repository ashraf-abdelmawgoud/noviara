<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Green Node Glow Filter -->
    <filter id="f-node-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00ffa8" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.6"/>
    </filter>

    <!-- White Center Node Glow Filter -->
    <filter id="f-white-node-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00ffa8" flood-opacity="0.65"/>
    </filter>

    <!-- Ambient Mark Halo Glow -->
    <filter id="f-halo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00ffa8" flood-opacity="0.35"/>
    </filter>

    <!-- Green Glowing Orb Gradient -->
    <radialGradient id="f-green-orb-grad" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#a8ffdf"/>
      <stop offset="60%" stop-color="#00ffa8"/>
      <stop offset="100%" stop-color="#00cc7a"/>
    </radialGradient>

    <!-- Stroke Gradient -->
    <linearGradient id="f-stroke-grad" gradientUnits="userSpaceOnUse" x1="50" y1="50" x2="150" y2="150">
      <stop offset="0%" stop-color="#00ffa8"/>
      <stop offset="50%" stop-color="#00f299"/>
      <stop offset="100%" stop-color="#00d680"/>
    </linearGradient>
  </defs>

  <!-- Frameless Floating Circuit Mark -->
  <g filter="url(#f-halo-glow)">
    <!-- Left Vertical Line (BL to TL) - Solid Fallback & Gradient -->
    <line x1="56" y1="144" x2="56" y2="54" stroke="#00ffa8" stroke-width="13" stroke-linecap="round"/>
    <line x1="56" y1="144" x2="56" y2="54" stroke="url(#f-stroke-grad)" stroke-width="13" stroke-linecap="round"/>

    <!-- Continuous Main 'N' Trace (BL -> TL -> White Center -> Curve -> TR) -->
    <path d="M 56 144 L 56 54 L 104 96 L 131 120 Q 144 130 144 114 L 144 56" fill="none" stroke="url(#f-stroke-grad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lower Parallel Trace -->
    <path d="M 79 106 L 121 144 Q 133 150 148 150" fill="none" stroke="url(#f-stroke-grad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 4 Glowing Green Nodes -->
    <circle cx="56" cy="54" r="15" fill="url(#f-green-orb-grad)" filter="url(#f-node-glow)"/>
    <circle cx="56" cy="144" r="15" fill="url(#f-green-orb-grad)" filter="url(#f-node-glow)"/>
    <circle cx="144" cy="56" r="15" fill="url(#f-green-orb-grad)" filter="url(#f-node-glow)"/>
    <circle cx="148" cy="150" r="15" fill="url(#f-green-orb-grad)" filter="url(#f-node-glow)"/>

    <!-- Central White Node -->
    <circle cx="104" cy="96" r="13.5" fill="#ffffff" filter="url(#f-white-node-glow)"/>
  </g>
</svg>
